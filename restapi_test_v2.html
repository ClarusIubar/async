<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>호출/렌더링 분리형 대조 테스트</title>
    <style>
        :root { --sync-color: #ff4757; --async-color: #1e90ff; }
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        .monitor { background: #222; color: #0f0; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        #checker { width: 100%; height: 40px; position: relative; border-bottom: 1px solid #444; }
        #pika { position: absolute; width: 40px; height: 40px; background: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png') no-repeat center/contain; }
        
        .container { display: flex; justify-content: center; gap: 20px; }
        .column { flex: 1; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-sync { background: var(--sync-color); }
        .btn-async { background: var(--async-color); }
        .status { font-size: 0.9rem; color: #666; margin-bottom: 10px; height: 20px; }
        .display { height: 400px; overflow-y: auto; background: #eee; border-radius: 5px; padding: 10px; }
        .card { display: inline-block; width: 60px; background: white; margin: 2px; font-size: 10px; border-radius: 4px; }
        .card img { width: 100%; }
    </style>
</head>
<body>

    <div class="monitor">
        <div id="checker"><div id="pika"></div></div>
        <p>피카츄가 멈추면 브라우저가 죽은 것입니다.</p>
    </div>

    <div class="container">
        <div class="column">
            <button class="btn-sync" onclick="runSyncTest()">동기 방식 (마비 유발)</button>
            <div id="sync-status" class="status">대기 중...</div>
            <div id="sync-display" class="display"></div>
        </div>

        <div class="column">
            <button class="btn-async" onclick="runAsyncTest()">비동기 방식 (생존)</button>
            <div id="async-status" class="status">대기 중...</div>
            <div id="async-display" class="display"></div>
        </div>
    </div>

    <script>
        const CONFIG = { TOTAL: 40, URL: 'https://pokeapi.co/api/v2/pokemon/', HOG_MS: 50 };

        // 애니메이션 (메인 스레드 모니터)
        const pika = document.getElementById('pika');
        let pos = 0; let dir = 1;
        function animate() {
            pos += 4 * dir;
            if (pos > document.getElementById('checker').offsetWidth - 40 || pos < 0) dir *= -1;
            pika.style.left = pos + 'px';
            requestAnimationFrame(animate);
        }
        animate();

        // [추출] 순수 데이터 호출 파트
        async function getAllData() {
            const promises = Array.from({ length: CONFIG.TOTAL }, (_, i) => 
                fetch(CONFIG.URL + (i + 1)).then(res => res.json())
            );
            return await Promise.all(promises);
        }

        // [부하] CPU 점유 시뮬레이션
        function cpuWork(ms) {
            const end = Date.now() + ms;
            while (Date.now() < end) {}
        }

        // ---------------------------------------------------------
        // 1. 동기 렌더링: 데이터를 받은 후 "쉼 없이" 몰아서 처리
        // ---------------------------------------------------------
        async function runSyncTest() {
            const status = document.getElementById('sync-status');
            const display = document.getElementById('sync-display');
            display.innerHTML = '';
            
            status.textContent = "데이터 호출 중...";
            const dataList = await getAllData(); // 호출은 비동기로 빠르게 끝냄
            
            status.textContent = "동기 렌더링 시작 (피카츄 사망 예정)...";
            const start = Date.now();

            dataList.forEach((data, i) => {
                // 렌더링 한 번 할 때마다 CPU 부하를 걸고, 제어권을 절대 안 넘김
                cpuWork(CONFIG.HOG_MS); 
                const card = `<div class="card"><img src="${data.sprites.front_default}">#${data.id}</div>`;
                display.insertAdjacentHTML('beforeend', card);
            });

            status.textContent = `완료: ${((Date.now() - start)/1000).toFixed(2)}s`;
        }

        // ---------------------------------------------------------
        // 2. 비동기 렌더링: 데이터를 받은 후 "한 틱씩 양보하며" 처리
        // ---------------------------------------------------------
        async function runAsyncTest() {
            const status = document.getElementById('async-status');
            const display = document.getElementById('async-display');
            display.innerHTML = '';

            status.textContent = "데이터 호출 중...";
            const dataList = await getAllData();

            status.textContent = "비동기 렌더링 시작 (피카츄 생존 예정)...";
            const start = Date.now();

            for (const data of dataList) {
                // [핵심] 처리 직전에 브라우저에게 "너 할 일 해"라고 기회를 줌
                await new Promise(resolve => setTimeout(resolve, 0));
                
                cpuWork(CONFIG.HOG_MS);
                const card = `<div class="card"><img src="${data.sprites.front_default}">#${data.id}</div>`;
                display.insertAdjacentHTML('beforeend', card);
            }

            status.textContent = `완료: ${((Date.now() - start)/1000).toFixed(2)}s`;
        }
    </script>
</body>
</html>
