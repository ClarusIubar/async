<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>진짜 '마비'를 보여주는 REST API 대조</title>
    <style>
        :root { --sync-color: #ff4757; --async-color: #1e90ff; }
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .monitor { background: #333; color: #00ff00; padding: 20px; border-radius: 15px; margin-bottom: 20px; position: sticky; top: 0; z-index: 100; }
        #checker-box { width: 100%; height: 60px; position: relative; border-bottom: 1px solid #444; }
        #pika { position: absolute; width: 60px; height: 60px; background: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png') no-repeat center/contain; left: 0; }
        
        .container { display: flex; justify-content: center; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .column { flex: 1; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-sync { background: var(--sync-color); }
        .btn-async { background: var(--async-color); }
        .status { font-weight: bold; margin-bottom: 10px; min-height: 24px; }
        .display { height: 300px; overflow-y: auto; background: #f9f9f9; border-radius: 10px; border: 1px solid #ddd; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .card { background: white; border: 1px solid #eee; padding: 5px; font-size: 10px; border-radius: 5px; }
        .card img { width: 100%; }
    </style>
</head>
<body>

    <div class="monitor">
        <div id="checker-box"><div id="pika"></div></div>
        <p><b>피카츄 모니터:</b> 피카츄가 멈추면 메인 스레드가 "데이터 처리"에 붙잡힌 것입니다.</p>
    </div>

    <div class="container">
        <div class="column">
            <button class="btn-sync" onclick="runSync()">동기적 데이터 처리<br>(메인 스레드 점유)</button>
            <div id="sync-status" class="status">대기 중...</div>
            <div id="sync-display" class="display"></div>
        </div>

        <div class="column">
            <button class="btn-async" onclick="runAsync()">비동기적 데이터 처리<br>(제어권 양보)</button>
            <div id="async-status" class="status">대기 중...</div>
            <div id="async-display" class="display"></div>
        </div>
    </div>

    <script>
        const CONFIG = { TOTAL: 20, URL: 'https://pokeapi.co/api/v2/pokemon/', HEAVY: 100 }; // 100ms 부하

        // 1. 피카츄 애니메이션 (메인 스레드 감시)
        const pika = document.getElementById('pika');
        let pos = 0; let dir = 1;
        function animate() {
            pos += 3 * dir;
            if (pos > document.getElementById('checker-box').offsetWidth - 60 || pos < 0) dir *= -1;
            pika.style.left = pos + 'px';
            requestAnimationFrame(animate);
        }
        animate();

        // 강제 CPU 부하 함수 (DB 저장이나 복잡한 연산 시뮬레이션)
        function cpuHog(ms) {
            const end = Date.now() + ms;
            while (Date.now() < end) { /* CPU를 놔주지 않음 */ }
        }

        // 2. 동기 수집 (피카츄가 멈춤)
        async function runSync() {
            const display = document.getElementById('sync-display');
            const status = document.getElementById('sync-status');
            display.innerHTML = '';
            const start = Date.now();

            for (let i = 1; i <= CONFIG.TOTAL; i++) {
                status.textContent = `데이터 수집/처리 중: ${i}/${CONFIG.TOTAL}`;
                
                const res = await fetch(CONFIG.URL + i);
                const data = await res.json();
                
                // [결정적 차이] 데이터 처리 시 CPU를 점유해버림
                cpuHog(CONFIG.HEAVY); 
                
                const card = `<div class="card"><img src="${data.sprites.front_default}">No.${data.id}</div>`;
                display.insertAdjacentHTML('beforeend', card);
            }

            status.textContent = `✅ 완료! (${((Date.now() - start)/1000).toFixed(2)}s)`;
        }

        // 3. 비동기 수집 (피카츄가 생존)
        async function runAsync() {
            const display = document.getElementById('async-display');
            const status = document.getElementById('async-status');
            display.innerHTML = '';
            const start = Date.now();

            for (let i = 1; i <= CONFIG.TOTAL; i++) {
                status.textContent = `데이터 수집/처리 중: ${i}/${CONFIG.TOTAL}`;

                // [핵심] 0ms 타임아웃으로 이벤트 루프에 제어권을 한 번 양보
                // 브라우저가 이 틈에 피카츄를 한 프레임 움직임
                await new Promise(res => setTimeout(res, 0));

                const res = await fetch(CONFIG.URL + i);
                const data = await res.json();

                cpuHog(CONFIG.HEAVY); // 동일한 부하를 걸지만, 위에서 한 번 양보함

                const card = `<div class="card"><img src="${data.sprites.front_default}">No.${data.id}</div>`;
                display.insertAdjacentHTML('beforeend', card);
            }

            status.textContent = `✅ 완료! (${((Date.now() - start)/1000).toFixed(2)}s)`;
        }
    </script>
</body>
</html>
